name: slang-wasm-lib (WASI)

# Builds the WASI-targeted slang-wasm-lib.wasm module and runs its example
# Java consumer's test suite. Kept as a standalone workflow (rather than wired
# into the shared ci-slang-build.yml matrix used by ci.yml) since
# slang-wasm-lib is a sibling WASM target with its own toolchain (wasi-sdk,
# not Emscripten) and its own consumer (a JVM/Endive test suite, not
# slang-test); scoping it separately keeps it from adding risk or runtime to
# the main CI matrix while it is still new. See
# source/slang-wasm-lib/README.md for the design and C ABI reference.

on:
  push:
    branches: [master]
    paths:
      - "source/slang-wasm-lib/**"
      - "include/slang.h"
      - ".github/workflows/slang-wasm-lib.yml"
  pull_request:
    paths:
      - "source/slang-wasm-lib/**"
      - "include/slang.h"
      - ".github/workflows/slang-wasm-lib.yml"

env:
  WASI_SDK_VERSION: "33"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: "recursive"

      - name: Install wasi-sdk
        run: |
          curl -L -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          mkdir -p "${HOME}/wasi-sdk"
          tar xf /tmp/wasi-sdk.tar.gz -C "${HOME}/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=${HOME}/wasi-sdk" >> "$GITHUB_ENV"

      - name: Build native generators
        run: |
          cmake --workflow --preset generators --fresh
          mkdir -p generators
          cmake --install build --config Release --prefix generators --component generators

      - name: Configure and build slang-wasm-lib.wasm
        run: |
          cmake -DSLANG_GENERATORS_PATH=generators/bin --preset wasi
          cmake --build --preset slang-wasm-lib

      # actions/setup-java is not yet pinned to a SHA elsewhere in this repo's
      # workflows (unlike actions/checkout and actions/upload-artifact above,
      # whose pins were copied verbatim from ci-slang-build.yml); pin this to
      # a commit SHA to match repo convention once one has been verified.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Java tests
        working-directory: source/slang-wasm-lib/java
        run: |
          ./gradlew test --console=plain \
            -Pslang.wasm.path="${GITHUB_WORKSPACE}/build.wasi/Release/bin/slang-wasm-lib.wasm"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slang-wasm-lib-java-test-report
          path: source/slang-wasm-lib/java/build/reports/tests/test/
          retention-days: 7

      - name: Upload slang-wasm-lib.wasm
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slang-wasm-lib.wasm
          path: build.wasi/Release/bin/slang-wasm-lib.wasm
          retention-days: 14
