plugins {
    id 'java'
}

group = 'org.shader-slang'
version = '0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets.main.java.srcDirs += ['src/generated/java']

repositories {
    mavenCentral()
}

dependencies {
    implementation 'run.endive:runtime:0.0.1'
    implementation 'run.endive:wasi:0.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    jvmArgs '-Xmx2g'

    // Point tests at the WASM artifact. Override with -Pslang.wasm.path=...
    // or the SLANG_WASM_PATH environment variable.
    def wasmPath = project.findProperty('slang.wasm.path')
        ?: System.getenv('SLANG_WASM_PATH')
        ?: "${rootProject.projectDir}/../../../build.wasi/Release/bin/slang-wasm-lib.wasm"

    systemProperty 'slang.wasm.path', wasmPath
}
